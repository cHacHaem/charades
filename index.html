<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Heads Up Charades</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1e1b4b;--sub:#6b7280;--accent:#6d28d9;--good:#16a34a;--pass:#ea580c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111f;--card:#201c33;--ink:#f3f0ff;--sub:#a5a1bd;--accent:#a78bfa}}
:root[data-theme="dark"]{--bg:#13111f;--card:#201c33;--ink:#f3f0ff;--sub:#a5a1bd;--accent:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
.screen{display:none;height:100%;width:100%;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:14px}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(28px,6vw,48px)}
p{margin:0;color:var(--sub);max-width:34em;line-height:1.4}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;width:min(600px,100%)}
#menu{overflow-y:auto;justify-content:safe center}#menu>*{flex-shrink:0}
.cat{background:var(--card);border:3px solid transparent;border-radius:18px;padding:10px 6px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
.cat span{display:block;font-size:30px;margin-bottom:4px}
.cat.sel{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 36px;font-size:20px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink)}
#game{transition:background .15s;color:#fff;background:#4c1d95}
#timer{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:18px;font-size:clamp(22px,5vw,36px);font-weight:800;font-variant-numeric:tabular-nums;opacity:.9}
#timer.low{color:#fecaca;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
#score{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:18px;font-size:clamp(18px,4vw,28px);font-weight:700;opacity:.8}
#word{font-size:clamp(40px,13vmax,150px);font-weight:900;line-height:1.05;word-break:break-word;padding:0 4vw}
#big{font-size:clamp(100px,30vmin,300px);font-weight:900}
.quit{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:600;opacity:.6}
.res{max-height:38vh;overflow:auto;width:min(420px,100%);text-align:left;background:var(--card);border-radius:14px;padding:10px 16px;font-size:16px}
.res div{padding:3px 0}.ok{color:var(--good)}.no{color:var(--pass)}
.score{font-size:72px;font-weight:900;color:var(--accent)}
</style>
</head>
<body>
<label id="hl" style="position:absolute;opacity:0;pointer-events:none"><input type="checkbox" switch id="hs"></label>

<div id="menu" class="screen on">
  <h1>Heads Up!</h1>
  <p>Pick a category, put the phone on your forehead (landscape), and let friends act it out. Tilt down for correct, tilt up to pass. You get 60 seconds.</p>
  <div class="cats" id="cats"></div>
  <button class="btn" id="start">Start</button>
  <div><button class="btn ghost" id="test" style="font-size:16px;padding:10px 22px">Test haptics</button>
  <label style="margin-left:12px;color:var(--sub)"><input type="checkbox" id="snd" checked> Sound cues</label></div>
  <p id="note"></p>
</div>

<div id="count" class="screen" style="background:#0f172a;color:#fff">
  <p style="color:#cbd5e1;font-size:20px">Put the phone on your forehead</p>
  <div id="big">3</div>
  <button class="quit">✕ Quit</button>
</div>

<div id="game" class="screen">
  <div id="score">0</div><div id="timer">60</div>
  <div id="word"></div>
  <button class="quit">✕ Quit round</button>
</div>

<div id="end" class="screen">
  <p style="font-size:20px">Time's up!</p>
  <div class="score" id="final">0</div>
  <div class="res" id="res"></div>
  <button class="btn" id="again">Play again</button>
  <button class="btn ghost" id="home">Change category</button>
</div>

<script>
const CATS={
  animals:{n:'Animals',e:'🦁',w:['Elephant','Giraffe','Penguin','Kangaroo','Octopus','Flamingo','Gorilla','Dolphin','Sloth','Crocodile','Peacock','Hedgehog','Shark','Owl','Camel','Butterfly','Panda','Lobster','Bat','Chameleon','Zebra','Squirrel','Seahorse','Rhino','Koala','Cheetah','Jellyfish','Woodpecker','Platypus','Turtle']},
  food:{n:'Food',e:'🍕',w:['Pizza','Sushi','Tacos','Spaghetti','Pancakes','Popcorn','Hamburger','Ice cream','Watermelon','Hot dog','Burrito','Donut','Pretzel','Lasagna','Cupcake','Broccoli','French fries','Pineapple','Ramen','Waffles','Nachos','Cheesecake','Avocado','Fried chicken','Cereal','Meatballs','Dumplings','Corn on the cob','Grilled cheese','Banana split']},
  instruments:{n:'Instruments',e:'🎸',w:['Guitar','Piano','Drums','Violin','Trumpet','Saxophone','Flute','Harp','Banjo','Accordion','Tuba','Cello','Harmonica','Bagpipes','Xylophone','Ukulele','Clarinet','Trombone','Tambourine','Triangle','Bass guitar','Keyboard','Maracas','Oboe','Bongos','Recorder','Cowbell','Organ','Mandolin','Didgeridoo']},
  countries:{n:'Countries',e:'🌍',w:['Brazil','Japan','Egypt','Canada','Australia','Italy','Mexico','India','France','Kenya','Norway','Argentina','China','Greece','Spain','Peru','Germany','Thailand','Ireland','Jamaica','Switzerland','Russia','Turkey','South Africa','Vietnam','Cuba','Iceland','New Zealand','Portugal','Morocco']}
  ,sports:{n:'Sports',e:'🏀',w:['Basketball','Swimming','Surfing','Archery','Bowling','Boxing','Golf','Skateboarding','Tennis','Fencing','Wrestling','Skiing','Baseball','Gymnastics','Rock climbing','Volleyball','Weightlifting','Rowing','Hockey','Karate','Pole vault','Diving','Cycling','Javelin throw','Badminton','Snowboarding','Table tennis','Sumo','Cricket','Soccer']},
  games:{n:'Video Games',e:'🎮',w:['Minecraft','Mario Kart','Fortnite','Tetris','Pac-Man','Among Us','Roblox','Zelda','Pokémon','Sonic','Fall Guys','Call of Duty','Animal Crossing','Rocket League','Super Smash Bros','Angry Birds','Just Dance','Overwatch','Subway Surfers','Flappy Bird','Candy Crush','Mortal Kombat','Splatoon','Halo','Donkey Kong','Space Invaders','The Sims','Skyrim','Clash Royale','Cuphead']},
  fastfood:{n:'Fast Food',e:'🍔',w:["McDonald's","Burger King","Wendy's","Taco Bell","KFC","Subway","Chick-fil-A","Domino's","Pizza Hut","Chipotle","Popeyes","Five Guys","In-N-Out","Dunkin'","Starbucks","Sonic Drive-In","Panda Express","Arby's","Jack in the Box","Papa John's","Panera","Dairy Queen","Shake Shack","White Castle","Wingstop","Little Caesars","Culver's","Jimmy John's","Whataburger","Krispy Kreme"]},
  companies:{n:'Companies',e:'🏢',w:['Apple','Google','Amazon','Nike','Disney','Netflix','Tesla','Microsoft','Nintendo','LEGO','Coca-Cola','Adidas','Spotify','Target','Walmart','IKEA','Samsung','Sony','YouTube','Uber','Meta','Pixar','Costco','Home Depot','PlayStation','Intel','Visa','Red Bull','Toyota']}
  ,artists:{n:'Music Artists',e:'🎤',w:['Taylor Swift','Drake','Beyoncé','Ed Sheeran','Billie Eilish','The Weeknd','Kanye West','Rihanna','Eminem','Ariana Grande','Bad Bunny','Post Malone','Adele','Bruno Mars','Justin Bieber','Lady Gaga','Travis Scott','Kendrick Lamar','Dua Lipa','Elvis Presley','Michael Jackson','Olivia Rodrigo','Harry Styles','Queen','The Beatles','Nicki Minaj','Lizzo','Jay-Z','Katy Perry','Shakira']},
  apps:{n:'Apps',e:'📱',w:['Instagram','TikTok','Snapchat','YouTube','Spotify','Netflix','Uber','DoorDash','Venmo','WhatsApp','Discord','Google Maps','Duolingo','Twitter','Pinterest','Reddit','Zoom','Instagram Reels','Shazam','Calculator','Camera','Weather','Notes','FaceTime','Amazon','Waze','Twitch','BeReal','Tinder','Cash App','Gmail','Clash of Clans','Candy Crush','Calendar','Flashlight']},
  movies:{n:'Movies',e:'🎬',w:['Titanic','Jaws','Shrek','Frozen','Avatar','Toy Story','The Lion King','Star Wars','Jurassic Park','Finding Nemo','Harry Potter','The Matrix','Spider-Man','Barbie','Inception','Home Alone','Moana','Up','Cars','Black Panther','Ghostbusters','Back to the Future','The Incredibles','Minions','Mean Girls','Rocky','Forrest Gump','Coco','Encanto','Jumanji']},
  tv:{n:'TV Shows',e:'📺',w:['Friends','The Office','Stranger Things','SpongeBob','Squid Game','Breaking Bad','Game of Thrones','The Simpsons','Bluey','Wednesday','Family Guy','Seinfeld','The Mandalorian','Bridgerton','Avatar: The Last Airbender','Phineas and Ferb','Gilmore Girls','Brooklyn Nine-Nine','Survivor','Shark Tank','Love Island','The Bear','Rick and Morty','Modern Family','South Park','Jeopardy','Hannah Montana','Ted Lasso','Peppa Pig','Sesame Street']},
  heroes:{n:'Superheroes',e:'🦸',w:['Batman','Superman','Spider-Man','Iron Man','Thor','Hulk','Wonder Woman','Black Widow','Captain America','Aquaman','The Flash','Deadpool','Wolverine','Black Panther','Doctor Strange','Ant-Man','Green Lantern','Catwoman','Robin','Joker','Thanos','Venom','Hawkeye','Storm','Scarlet Witch','Captain Marvel','Groot','Star-Lord','Supergirl','Shazam']},
  cartoons:{n:'Cartoon Characters',e:'🐭',w:['Mickey Mouse','Bugs Bunny','Homer Simpson','SpongeBob','Scooby-Doo','Tom and Jerry','Pikachu','Winnie the Pooh','Elsa','Woody','Buzz Lightyear','Shrek','Donald Duck','Goofy','Garfield','Snoopy','Dora','Patrick Star','Mario','Sonic','Olaf','Simba','Nemo','Dory','Stitch','Minion','Bluey','Peppa Pig','Pinocchio','Popeye']},
  jobs:{n:'Jobs',e:'👷',w:['Firefighter','Teacher','Doctor','Chef','Pilot','Astronaut','Plumber','Barber','Police officer','Farmer','Dentist','Photographer','Lifeguard','Mail carrier','Magician','Construction worker','Veterinarian','Mechanic','Judge','DJ','Painter','Referee','Waiter','Librarian','Tailor','Carpenter','Lumberjack','Fisherman','Janitor','Clown']},
  household:{n:'Household Items',e:'🧹',w:['Toaster','Vacuum cleaner','Microwave','Toothbrush','Blender','Umbrella','Hair dryer','Remote control','Washing machine','Ironing board','Lawn mower','Ceiling fan','Doorbell','Stapler','Scissors','Mop','Alarm clock','Hammer','Flashlight','Coffee maker','Garbage can','Mirror','Staircase','Shower','Frying pan','Can opener','Vending machine','Lightbulb','Rubber duck','Broom']},
  athletes:{n:'Athletes',e:'🏅',w:['LeBron James','Lionel Messi','Serena Williams','Michael Jordan','Cristiano Ronaldo','Tom Brady','Usain Bolt','Simone Biles','Stephen Curry','Tiger Woods','Patrick Mahomes','Shaquille O\'Neal','Muhammad Ali','Michael Phelps','Roger Federer','Kobe Bryant','Travis Kelce','Caitlin Clark','Shohei Ohtani','Naomi Osaka','Lewis Hamilton','Babe Ruth','Wayne Gretzky','Venus Williams','Kylian Mbappé','Giannis Antetokounmpo','Conor McGregor','Megan Rapinoe','Derek Jeter','Lindsey Vonn']},
  hobbies:{n:'Hobbies',e:'🎨',w:['Knitting','Fishing','Gardening','Photography','Chess','Painting','Hiking','Baking','Yoga','Camping','Skydiving','Pottery','Birdwatching','Karaoke','Origami','Juggling','Scrapbooking','Surfing','Bowling','Magic tricks','Puzzles','Woodworking','Stargazing','Meditation','Dancing','Video editing','Bird feeding','Collecting stamps','Roller skating','Gaming']}
};
const $=id=>document.getElementById(id);
let cat='animals',deck=[],cur='',score=0,results=[],end=0,lastSec=60,phase='menu',armed=false,locked=false,timerId=null,sensorOn=false;

let actx=null,soundOn=true;
function beep(f,d){ if(!soundOn||!actx)return; try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d/1000)}catch(e){} }
function haptic(p,f=600){
  beep(f,Math.max(60,Array.isArray(p)?p[0]:p));
  let ok=false;
  try{ if(navigator.vibrate) ok=navigator.vibrate(p) }catch(e){}
  if(!ok){ try{$('hl').click()}catch(e){} } // iOS best effort (only works inside a tap)
  return ok;
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

let recent=[];try{recent=JSON.parse(localStorage.getItem('hu_recent')||'[]').filter(k=>CATS[k])}catch(e){}
if(recent[0])cat=recent[0];
function touch(k){recent=[k,...recent.filter(x=>x!==k)];try{localStorage.setItem('hu_recent',JSON.stringify(recent))}catch(e){}}
function renderCats(){
  $('cats').innerHTML='';
  [...recent,...Object.keys(CATS).filter(k=>!recent.includes(k))].forEach(k=>{
    const c=CATS[k],b=document.createElement('button');b.className='cat'+(k===cat?' sel':'');
    b.innerHTML=`<span>${c.e}</span>${c.n}`;
    b.onclick=()=>{cat=k;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};
    $('cats').appendChild(b);
  });
}
renderCats();

function nextWord(){
  if(!deck.length)deck=shuffle(CATS[cat].w);
  cur=deck.pop();$('word').textContent=cur;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function begin(){
  lockScreen();touch(cat);
  score=0;results=[];deck=shuffle(CATS[cat].w);phase='count';
  $('score').textContent='0';$('timer').textContent='60';$('timer').classList.remove('low');
  show('count');
  for(const n of [3,2,1]){ $('big').textContent=n; haptic(70); await sleep(1000); if(phase!=='count')return }
  haptic([150]);
  $('game').style.background='#4c1d95';
  nextWord();show('game');
  phase='play';armed=false;locked=false;lastSec=60;
  end=Date.now()+60000;
  timerId=setInterval(tick,100);
}
function tick(){
  const s=Math.max(0,Math.ceil((end-Date.now())/1000));
  if(s!==lastSec){
    lastSec=s;$('timer').textContent=s;
    if(s<=10&&s>0){haptic(60,1000);$('timer').classList.add('low')}
  }
  if(s<=0)finish();
}
async function act(kind){
  if(phase!=='play'||locked)return;
  locked=true;armed=false;
  const ok=kind==='correct';
  if(ok)score++;
  results.push({w:cur,ok});
  $('score').textContent=score;
  haptic(ok?[120]:[40,40,40],ok?880:330);
  $('game').style.background=ok?'#16a34a':'#ea580c';
  $('word').textContent=ok?'Correct!':'Pass';
  await sleep(650);
  if(phase!=='play')return;
  $('game').style.background='#4c1d95';
  nextWord();locked=false;
}
function onOri(e){
  if(e.beta==null||e.gamma==null)return;
  sensorOn=true;
  if(phase!=='play'||locked)return;
  const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
  const z=Math.cos(b)*Math.cos(g); // +1 screen faces ceiling, -1 screen faces floor
  if(armed){ if(z<-0.55)act('correct'); else if(z>0.55)act('pass') }
  else if(Math.abs(z)<0.3)armed=true;
}
function finish(){
  clearInterval(timerId);phase='end';unlockScreen();
  haptic([200,100,200],440);
  $('final').textContent=score;
  $('res').innerHTML=results.length?results.map(r=>`<div class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'} ${r.w}</div>`).join(''):'<div>No words played.</div>';
  show('end');
}
let silentEl=null,wl=null;
function silentLoop(){ // lets sound play even when the iPhone ringer switch is on silent
  try{ if(navigator.audioSession)navigator.audioSession.type='playback' }catch(e){}
  try{ if(!silentEl){ const n=8000,buf=new ArrayBuffer(44+n),v=new DataView(buf);
    const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
    for(let i=0;i<n;i++)v.setUint8(44+i,128);
    silentEl=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));silentEl.loop=true }
    silentEl.play().catch(()=>{}) }catch(e){}
}
function stopSilent(){ try{silentEl&&silentEl.pause()}catch(e){} }
async function lockScreen(){ try{ if(navigator.wakeLock) wl=await navigator.wakeLock.request('screen') }catch(e){} }
function unlockScreen(){ try{wl&&wl.release()}catch(e){} wl=null }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&(phase==='count'||phase==='play'))lockScreen() });
function goFull(){ const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
  if(f){ try{ const r=f.call(el); Promise.resolve(r).then(()=>{ try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){} }).catch(()=>{}) }catch(e){} } }
function leaveFull(){ try{ if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document) }catch(e){} try{screen.orientation.unlock()}catch(e){} }
function quit(){ clearInterval(timerId);phase='menu';unlockScreen();stopSilent();leaveFull();$('timer').classList.remove('low');renderCats();show('menu') }
function initAudio(){ silentLoop(); try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended')actx.resume() }catch(e){} soundOn=$('snd').checked }
$('test').onclick=()=>{ initAudio(); const ok=haptic([200],700); setTimeout(stopSilent,600);
  $('note').textContent=ok?'Vibration sent. If you felt nothing, check your phone\'s vibration / touch feedback settings.':'This browser blocked vibration (iPhone browsers can\'t vibrate from web pages, and some in-app views block it). Sound cues will be used instead.' };
$('start').onclick=async()=>{ goFull(); initAudio();
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{ const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted')$('note').textContent='Motion access denied. Tilt controls need motion access (on desktop, use the arrow keys).' }catch(e){}
  }
  window.addEventListener('deviceorientation',onOri);
  begin();
};
document.querySelectorAll('.quit').forEach(b=>b.onclick=quit);
addEventListener('keydown',e=>{if(e.key==='ArrowDown')act('correct');if(e.key==='ArrowUp')act('pass')});
$('again').onclick=()=>{goFull();initAudio();begin()};
$('home').onclick=()=>{phase='menu';stopSilent();leaveFull();renderCats();show('menu')};
</script>
</body>
</html>
